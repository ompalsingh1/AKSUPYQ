<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSUPYQ</title>
    <!-- <link rel="stylesheet" href="css/style.css">     -->
     <link rel="stylesheet" href="css/home.css">
     <link rel="stylesheet" href="css/global.css">
     <link rel="stylesheet" href="css/navbar.css">

</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <img src="" alt="" class="logo-image">
                <span  id="logoText" class="logo-text">AKSUPYQ  <span id="adminBadge"></span></span>
            </div>
        <div class="navs">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="queries.html">Queries</a></li>
            </ul>
        </div>
        <div class="logout">
            <button id="logoutbtn" class="logoutbtn">Logout</button>
        </div>
        </div>
    </header>
   <section class="content">

    <div class="welcome-message">
        <h1>Welcome to the AKSUPYQ</h1>

    <h2>Select Your Branch</h2>
    </div>

    <div id="branchContainer"
class="branch-container">

</div>


<!-- CUSTOM ALERT -->

<div
id="customAlert"

class="custom-alert">

</div>


<!-- ADD / EDIT BRANCH MODAL -->

<div
id="branchModal"

class="custom-popup">

    <div class="popup-box">

        <h2 id="modalTitle">

            Add Branch

        </h2>

        <input

        type="text"

        id="branchInput"

        placeholder="Enter branch name"

        class="popup-input"

        >

        <div class="popup-buttons">

            <button
            id="cancelModal"

            class="cancel-btn">

                Cancel

            </button>

            <button
            id="saveModal"

            class="confirm-btn">

                Save

            </button>

        </div>

    </div>

</div>


<!-- DELETE BRANCH POPUP -->

<div
id="deletePopup"

class="custom-popup">

    <div class="popup-box">

        <h2>
            Delete Branch?
        </h2>

        <p>
            This action cannot be undone.
        </p>

        <div class="popup-buttons">

            <button
            id="cancelDelete"

            class="cancel-btn">

                Cancel

            </button>

            <button
            id="confirmDelete"

            class="confirm-btn">

                Delete

            </button>

        </div>

    </div>

</div>


<script src="js/home.js"></script>
</section>
<footer class="footer">

    <p>
        © 2026 AKSUPYQ | Developed by Ompal Singh | All Rights Reserved
    </p>

</footer>
</body>
</html>
