<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Papers</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/papers.css">

</head>

<body>

    <header class="navbar">
        <div class="container">
            <div class="logo">
                <img src="" alt="" class="logo-image">
                <span id="logoText" class="logo-text">AKSUPYQ <span id="adminBadge"></span></span>
            </div>
            <div class="navs">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="queries.html">Queries</a></li>
                </ul>
            </div>
            <div class="logout">
                <button id="logoutbtn" class="logoutbtn">Logout</button>
            </div>
        </div>
    </header>


    <section class="content">

        <h1 id="subjectTitle">
            Papers
        </h1>

        <div id="paperContainer" class="branch-container">

        </div>
        <!-- UPLOAD MODAL -->

        <div id="uploadModal" class="modal">

            <div class="modal-content">

                <span id="closeModal" class="close-btn">

                    &times;

                </span>

                <h2>Upload Paper</h2>

                <form id="uploadForm">

                    <input type="text" id="paperName" placeholder="Paper Name" required>

                    <input type="text" id="year" placeholder="Year" required>

                    <input type="file" id="pdfFile" accept=".pdf" required>

                    <button type="submit">
                        Upload Paper
                    </button>

                </form>

            </div>

        </div>

    </section>

    <div id="customPopup" class="custom-popup">

        <div class="popup-box">

            <h2>
                Delete Paper?
            </h2>

            <p>
                This action cannot be undone.
            </p>

            <div class="popup-buttons">

                <button id="cancelDelete" class="cancel-btn">

                    Cancel

                </button>

                <button id="confirmDelete" class="confirm-btn">

                    Delete

                </button>

            </div>

        </div>

    </div>


    <div id="customAlert" class="custom-alert">

    </div>

    <script src="js/papers.js"></script>

</body>

</html>
