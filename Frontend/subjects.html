<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Subjects</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/subjects.css">

</head>

<body>

    <header class="navbar">
        <div class="container">
            <div class="logo">
                <img src="" alt="" class="logo-image">
                <span  id="logoText" class="logo-text">AKSUPYQ  <span id="adminBadge"></span></span>
            </div>
        <div class="navs">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="queries.html">Queries</a></li>
            </ul>
        </div>
        <div class="logout">
            <button id="logoutbtn" class="logoutbtn">Logout</button>
        </div>
        </div>
    </header>

    <section class="content">

        <h1 id="branchTitle">
            Subjects
        </h1>

        <div id="subjectContainer"
        class="branch-container">

        </div>

        <div
id="customAlert"

class="custom-alert">

</div>


<!-- ADD / EDIT SUBJECT MODAL -->

<div
id="subjectModal"

class="custom-popup">

    <div class="popup-box">

        <h2 id="modalTitle">

            Add Subject

        </h2>

        <input

        type="text"

        id="subjectInput"

        placeholder="Enter subject name"

        class="popup-input"

        >

        <div class="popup-buttons">

            <button
            id="cancelModal"

            class="cancel-btn">

                Cancel

            </button>

            <button
            id="saveModal"

            class="confirm-btn">

                Save

            </button>

        </div>

    </div>

</div>


<!-- DELETE SUBJECT POPUP -->

<div
id="deletePopup"

class="custom-popup">

    <div class="popup-box">

        <h2>
            Delete Subject?
        </h2>

        <p>
            This action cannot be undone.
        </p>

        <div class="popup-buttons">

            <button
            id="cancelDelete"

            class="cancel-btn">

                Cancel

            </button>

            <button
            id="confirmDelete"

            class="confirm-btn">

                Delete

            </button>

        </div>

    </div>

</div>

    </section>

    <script src="js/subjects.js"></script>

</body>

</html>
